[project]
name = "corpora-linking"
version = "0.1.0"
description = "Revision-aware citation and selection linking core"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.11,<3"]

[project.urls]
Homepage = "https://github.com/exegia/corpora-linking"
Documentation = "https://github.com/exegia/corpora-linking#readme"
Repository = "https://github.com/exegia/corpora-linking"
Issues = "https://github.com/exegia/corpora-linking/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "mypy>=1.15"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["src", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpora_linking"]
