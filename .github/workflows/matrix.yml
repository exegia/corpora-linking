# Cross-platform coverage.
#
# `check` in pr.yml is deliberately a single job on one runner: it is a
# required status check on main, and a matrixed job reports contexts like
# "test (macos-14)" rather than the plain "check" the ruleset names, which
# would leave every PR unmergeable. This workflow keeps the breadth — the
# current and previous macOS images (macOS only: the tap targets Homebrew on
# macOS, and Windows has no Homebrew at all) — where it does not collide with
# a required context:
#
#   * every push to `next` or a release branch, so an older-macOS-only break
#     surfaces on staging / the in-flight RC rather than on the release PR;
#   * weekly, to catch upstream drift (a new corpora-py release or a Homebrew
#     core change) on an untouched tree;
#   * on demand.
name: Matrix

on:
  push:
    branches:
      - next
      - "release/v*"
  schedule:
    # Every Sunday at 8:05 UTC.
    - cron: "5 8 * * 0"
  workflow_dispatch:

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, macos-14 ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Style, audit, install, test
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: make ci
